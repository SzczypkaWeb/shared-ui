name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

# `packages: write` lets the automatic GITHUB_TOKEN below publish to GitHub
# Packages for THIS repo directly — no separate write:packages PAT needed.
# `pull-requests: write` + `contents: write` let changesets/action open/update
# the "Version Packages" PR.
permissions:
  contents: write
  pull-requests: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The repo's real lockfile is pnpm-lock.yaml (see pnpm-workspace.yaml's
      # allowBuilds/minimumReleaseAgeExclude settings) - this job used to run
      # plain `npm install`/`npm test`/`npm build`, which "worked" for
      # build/test (npm just ignores pnpm-lock.yaml and resolves its own
      # tree) but broke the moment changeset:publish actually ran for real:
      # @changesets/cli detects the package manager from the lockfile present
      # in the repo, sees pnpm-lock.yaml, and shells out to `pnpm publish` -
      # which doesn't exist on the runner without this step, hence
      # `spawn pnpm ENOENT`. Same fix/reasoning as react-app/frontend-shell's
      # "Enable Corepack (pnpm)" step.
      - name: Enable Corepack (pnpm)
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: '@szczypkaweb'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      # If there are pending changesets on main: opens/updates a "Version
      # Packages" PR with the version bump + changelog, doesn't publish yet.
      # If that PR was just merged (no pending changesets, version already
      # bumped): runs the publish command instead.
      - name: Create Release Pull Request or Publish
        uses: changesets/action@v1
        with:
          publish: pnpm changeset:publish
          version: pnpm changeset:version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
