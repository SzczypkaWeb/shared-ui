name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

# `packages: write` lets the automatic GITHUB_TOKEN below publish to GitHub
# Packages for THIS repo directly — no separate write:packages PAT needed.
# `pull-requests: write` + `contents: write` let changesets/action open/update
# the "Version Packages" PR.
permissions:
  contents: write
  pull-requests: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: '@szczypkaweb'

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      # If there are pending changesets on main: opens/updates a "Version
      # Packages" PR with the version bump + changelog, doesn't publish yet.
      # If that PR was just merged (no pending changesets, version already
      # bumped): runs the publish command instead.
      - name: Create Release Pull Request or Publish
        uses: changesets/action@v1
        with:
          publish: npm run changeset:publish
          version: npm run changeset:version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
